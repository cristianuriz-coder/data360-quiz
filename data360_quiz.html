<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Salesforce Data 360 Consultant Exam Quiz</title>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #2d3748;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* SCREEN SYSTEM */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── WELCOME ── */
  #welcome {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, #1e1b4b 0%, #0f0f1a 70%);
    padding: 2rem;
    text-align: center;
  }
  .logo { font-size: 4rem; margin-bottom: 1rem; }
  #welcome h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: .5rem; }
  #welcome .subtitle { color: var(--muted); font-size: 1.1rem; margin-bottom: 2rem; }
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; max-width: 900px; width: 100%; margin-bottom: 2rem; }
  .topic-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem;
    cursor: pointer; transition: all .2s; text-align: left;
  }
  .topic-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,.15); }
  .topic-card.selected { border-color: var(--accent); background: rgba(0,212,255,.08); }
  .topic-card .num { font-size: .75rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .topic-card h3 { font-size: 1rem; margin: .3rem 0 .2rem; }
  .topic-card .meta { font-size: .8rem; color: var(--muted); }
  .badge { display: inline-block; background: rgba(124,58,237,.3); color: #a78bfa; border-radius: 20px; font-size: .7rem; padding: .15rem .5rem; margin-top: .4rem; }
  .btn {
    background: linear-gradient(135deg, var(--accent2), #4f46e5);
    color: #fff; border: none; border-radius: 10px; padding: .9rem 2.5rem;
    font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all .2s;
    letter-spacing: .02em;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,58,237,.4); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn.secondary { background: var(--card); border: 1px solid var(--border); color: var(--text); }
  .btn.secondary:hover { border-color: var(--accent); box-shadow: none; }
  .btn.green { background: linear-gradient(135deg, #059669, #10b981); }

  /* ── QUIZ ── */
  #quiz { min-height: 100vh; background: var(--bg); padding: 0; }
  .quiz-header {
    background: var(--card2); border-bottom: 1px solid var(--border);
    padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .quiz-header .topic-label { font-size: .85rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .quiz-header h2 { font-size: 1.1rem; }
  .progress-wrap { flex: 1; max-width: 300px; margin: 0 2rem; }
  .progress-bar-bg { background: var(--border); border-radius: 99px; height: 8px; }
  .progress-bar-fill { background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 99px; height: 8px; transition: width .4s; }
  .progress-text { font-size: .75rem; color: var(--muted); margin-top: .3rem; text-align: right; }
  .timer-display { display: flex; align-items: center; gap: .4rem; font-size: 1rem; font-weight: 700; color: var(--accent); }

  .questions-container { max-width: 800px; margin: 0 auto; padding: 2rem; }

  .question-block {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 1.8rem; margin-bottom: 1.5rem; transition: border-color .2s;
  }
  .question-block.answered { border-color: rgba(0,212,255,.3); }
  .q-number { font-size: .75rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .6rem; }
  .q-text { font-size: 1.05rem; line-height: 1.65; margin-bottom: 1.2rem; }
  .options { display: flex; flex-direction: column; gap: .6rem; }
  .option-btn {
    background: rgba(255,255,255,.04); border: 2px solid var(--border);
    border-radius: 10px; padding: .9rem 1.2rem; text-align: left; cursor: pointer;
    font-size: .95rem; color: var(--text); transition: all .2s; display: flex; align-items: flex-start; gap: .8rem;
    width: 100%;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(0,212,255,.06); }
  .option-btn.selected { border-color: var(--accent2); background: rgba(124,58,237,.12); }
  .option-btn.correct { border-color: var(--green) !important; background: rgba(16,185,129,.12) !important; }
  .option-btn.wrong { border-color: var(--red) !important; background: rgba(239,68,68,.1) !important; }
  .option-btn:disabled { cursor: default; }
  .option-letter {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 28px; border-radius: 8px;
    background: var(--border); color: var(--muted); font-weight: 700; font-size: .85rem;
    flex-shrink: 0;
  }
  .option-btn.selected .option-letter { background: var(--accent2); color: #fff; }
  .option-btn.correct .option-letter { background: var(--green); color: #fff; }
  .option-btn.wrong .option-letter { background: var(--red); color: #fff; }
  .option-text { flex: 1; line-height: 1.5; }
  .result-badge {
    display: inline-flex; align-items: center; gap: .3rem; font-size: .8rem;
    padding: .2rem .6rem; border-radius: 99px; margin-left: auto; flex-shrink: 0;
  }
  .result-badge.correct-badge { background: rgba(16,185,129,.2); color: var(--green); }
  .result-badge.wrong-badge { background: rgba(239,68,68,.15); color: var(--red); }

  .explanation {
    margin-top: 1rem; padding: 1rem; background: rgba(0,212,255,.05);
    border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    font-size: .88rem; color: var(--muted); line-height: 1.6; display: none;
  }
  .explanation.show { display: block; }

  .quiz-footer {
    max-width: 800px; margin: 0 auto; padding: 1rem 2rem 3rem;
    display: flex; gap: 1rem; justify-content: flex-end;
  }

  /* ── RESULTS ── */
  #results {
    min-height: 100vh; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 3rem 2rem;
  }
  .results-hero { text-align: center; margin-bottom: 2.5rem; }
  .score-ring {
    width: 140px; height: 140px; border-radius: 50%;
    background: conic-gradient(var(--accent2) calc(var(--pct) * 1%), var(--border) 0);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    position: relative;
  }
  .score-ring::before {
    content: ''; position: absolute; inset: 12px;
    border-radius: 50%; background: var(--bg);
  }
  .score-ring-text {
    position: relative; z-index: 1; text-align: center;
  }
  .score-ring-text .big { font-size: 1.8rem; font-weight: 800; color: var(--accent); }
  .score-ring-text .small { font-size: .75rem; color: var(--muted); }
  .results-hero h2 { font-size: 1.6rem; font-weight: 800; }
  .results-hero .grade { font-size: 1rem; color: var(--muted); margin-top: .3rem; }

  .topic-results { width: 100%; max-width: 700px; }
  .topic-result-row {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.2rem 1.5rem; margin-bottom: .8rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .tr-label { flex: 1; }
  .tr-label .name { font-weight: 600; font-size: .95rem; }
  .tr-label .meta { font-size: .78rem; color: var(--muted); }
  .tr-bar-wrap { flex: 1; max-width: 180px; }
  .tr-bar-bg { background: var(--border); border-radius: 99px; height: 8px; }
  .tr-bar-fill { border-radius: 99px; height: 8px; }
  .tr-score { font-size: 1.1rem; font-weight: 700; min-width: 50px; text-align: right; }
  .tr-stars { font-size: 1rem; min-width: 50px; text-align: right; }

  .recommendations {
    width: 100%; max-width: 700px; margin-top: 1.5rem;
    background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;
  }
  .recommendations h3 { font-size: 1rem; color: var(--accent); margin-bottom: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .rec-item { display: flex; gap: .8rem; margin-bottom: .8rem; align-items: flex-start; font-size: .9rem; line-height: 1.5; }
  .rec-icon { font-size: 1.2rem; flex-shrink: 0; }

  .results-actions { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; justify-content: center; }
  .btn.retry { background: linear-gradient(135deg, #b45309, #f59e0b); color: #000; }
  .btn.retry:hover { box-shadow: 0 8px 24px rgba(245,158,11,.4); }
  .retry-banner {
    width: 100%; max-width: 700px; margin-top: 1rem;
    background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.3);
    border-radius: 12px; padding: 1rem 1.5rem;
    display: flex; align-items: center; gap: 1rem; font-size: .9rem;
  }
  .retry-banner .retry-icon { font-size: 1.5rem; flex-shrink: 0; }
  .retry-badge-wrong { display: inline-flex; align-items: center; justify-content: center;
    background: rgba(239,68,68,.2); color: var(--red); border-radius: 99px;
    font-size: .7rem; font-weight: 700; padding: .15rem .6rem; margin-left: .4rem; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* mobile */
  @media (max-width: 600px) {
    .quiz-header { flex-wrap: wrap; gap: .5rem; }
    .progress-wrap { max-width: 100%; margin: 0; order: 3; width: 100%; }
    .questions-container { padding: 1rem; }
    .question-block { padding: 1.2rem; }
  }
</style>
</head>
<body>

<!-- ══════════════ WELCOME SCREEN ══════════════ -->
<div id="welcome" class="screen active">
  <div class="logo">🎯</div>
  <h1>Data 360 Consultant</h1>
  <p class="subtitle">Salesforce Certification Exam Practice — 60 Questions across 6 Topics</p>

  <div class="topic-grid" id="topicGrid"></div>

  <button class="btn" id="startAllBtn">Start Full Exam (All Topics)</button>
  <p style="margin-top:1rem;font-size:.8rem;color:var(--muted)">Or click a topic card to study that section individually</p>
</div>

<!-- ══════════════ QUIZ SCREEN ══════════════ -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <div>
      <div class="topic-label" id="quizTopicLabel"></div>
      <div id="quizTopicName" style="font-size:.85rem;color:var(--muted)"></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-text" id="progressText"></div>
    </div>
    <div class="timer-display">⏱ <span id="timerDisplay">00:00</span></div>
  </div>

  <div class="questions-container" id="questionsContainer"></div>

  <div class="quiz-footer">
    <button class="btn secondary" id="backToMenuBtn">← Menu</button>
    <button class="btn" id="submitQuizBtn" disabled>Submit Answers</button>
  </div>
</div>

<!-- ══════════════ RESULTS SCREEN ══════════════ -->
<div id="results" class="screen">
  <div class="results-hero">
    <div class="score-ring" id="scoreRing">
      <div class="score-ring-text">
        <div class="big" id="scoreRingPct">0%</div>
        <div class="small" id="scoreRingFrac">0/0</div>
      </div>
    </div>
    <h2 id="resultsTitle"></h2>
    <div class="grade" id="resultsGrade"></div>
  </div>

  <div class="topic-results" id="topicResultsContainer"></div>
  <div class="recommendations" id="recommendationsBox" style="display:none">
    <h3>📚 Recommendations</h3>
    <div id="recommendationsList"></div>
  </div>

  <div id="retryBanner" class="retry-banner" style="display:none">
    <span class="retry-banner-icon">🔁</span>
    <span id="retryBannerText"></span>
  </div>

  <div class="results-actions">
    <button class="btn secondary" id="reviewAnswersBtn">Review Answers</button>
    <button class="btn retry" id="retryWrongBtn" style="display:none">🔁 Retry Wrong Answers</button>
    <button class="btn green" id="nextTopicBtn" style="display:none">Next Topic →</button>
    <button class="btn" id="restartBtn">Restart</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  QUESTION BANK — classified by exam topic
// ═══════════════════════════════════════════════════════

const TOPICS = [
  { id: 1, name: "Solution Positioning",                    weight: 14, target: 8,  color: "#00d4ff" },
  { id: 2, name: "Data 360 Setup & Administration",         weight: 13, target: 8,  color: "#7c3aed" },
  { id: 3, name: "Data Source Connection & Ingestion",      weight: 18, target: 11, color: "#f59e0b" },
  { id: 4, name: "Harmonization & Unification",             weight: 17, target: 10, color: "#ec4899" },
  { id: 5, name: "Data Enhancements, Sharing & Analysis",   weight: 18, target: 11, color: "#10b981" },
  { id: 6, name: "Data Activations & Utilization",          weight: 20, target: 12, color: "#ef4444" },
];

// Full classified question bank (from both source documents)
const ALL_QUESTIONS = [

// ─────────────────────────────────────────────────────
// TOPIC 1 — Solution Positioning (14%)
// ─────────────────────────────────────────────────────
{ id: "t1_1", topic: 1,
  q: "A retail company is evaluating Salesforce Data 360 to support their digital transformation. They want to unify customer data across their ecommerce platform, loyalty program, and physical stores. A consultant is explaining the value proposition. Which statement best describes a core capability of Salesforce Data 360 that addresses this need?",
  a: "Data 360 provides a marketing automation tool to manage email campaigns across all brand channels.",
  b: "Data 360 is a real-time customer data platform that ingests, harmonizes, and unifies data from multiple sources into a single customer profile.",
  c: "Data 360 is a data warehouse replacement that stores all enterprise data in a proprietary cloud storage layer.",
  d: "Data 360 is a business intelligence tool that creates dashboards for all departments from existing Salesforce CRM data.",
  correct: "b"
},
{ id: "t1_2", topic: 1,
  q: "A healthcare organization wants to build a 360-degree view of each patient by combining data from electronic health records (EHR), appointment systems, and billing platforms. They are concerned about HIPAA compliance. Which Data 360 positioning statement should a consultant emphasize?",
  a: "Data 360 is only suitable for marketing data and cannot be used for healthcare or regulated industries.",
  b: "Data 360 can ingest from any source but stores all data unencrypted by default, requiring a manual encryption step before going live.",

  b: "Data 360 differs from an EDW because it provides native identity resolution, segmentation, and real-time activation capabilities centered on the unified customer profile.",
  c: "Data 360 replaces an EDW entirely; once deployed, the customer's existing data warehouse becomes redundant.",
  d: "Data 360 and an EDW are functionally identical; the only difference is that Data 360 is hosted on Salesforce infrastructure.",
  correct: "b"

{ id: "t1_4", topic: 1,

  d: "Data 360 integrates only with Marketing Cloud, making it appropriate for email personalization but not for web or mobile.",

{ id: "t1_6", topic: 1,

{ id: "t1_8", topic: 1,

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let state = {
  mode: 'full',           // 'full' | 'topic' | 'retry'
  currentTopicId: null,
  topicQueue: [],         // for full exam: ordered topic ids
  activeTopicIndex: 0,
  questionsForTopic: {},  // topicId -> shuffled question array
  userAnswers: {},        // questionId -> selected letter
  scores: {},             // topicId -> { correct, total }
  wrongIds: {},           // topicId -> [questionId, ...]  — persists across retries
  retryAttempts: {},      // topicId -> number of retry rounds
  timerInterval: null,
  timerSeconds: 0,
  submitted: false,
};

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function fmt(s) {
  const m = Math.floor(s / 60).toString().padStart(2,'0');
  const sec = (s % 60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

function startTimer() {
  state.timerSeconds = 0;
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    state.timerSeconds++;
    document.getElementById('timerDisplay').textContent = fmt(state.timerSeconds);
  }, 1000);
}

function stopTimer() {
  clearInterval(state.timerInterval);
}

function getTopicQuestions(topicId) {
  const pool = ALL_QUESTIONS.filter(q => q.topic === topicId);
  const topic = TOPICS.find(t => t.id === topicId);
  const need = topic.target;
  return shuffle(pool).slice(0, need);
}

// ═══════════════════════════════════════════════════════
//  WELCOME SCREEN INIT
// ═══════════════════════════════════════════════════════
function initWelcome() {
  const grid = document.getElementById('topicGrid');
  grid.innerHTML = '';
  TOPICS.forEach(t => {
    const qCount = ALL_QUESTIONS.filter(q => q.topic === t.id).length;
    const score = state.scores[t.id];
    const wrong = state.wrongIds[t.id] || [];
    const card = document.createElement('div');
    card.className = 'topic-card';
    const scorePct = score ? Math.round(score.correct/score.total*100) : null;
    const scoreColor = scorePct === 100 ? 'var(--green)' : scorePct >= 80 ? 'var(--accent)' : scorePct >= 60 ? 'var(--yellow)' : 'var(--red)';
    card.innerHTML = `
      <div class="num">Topic ${t.id} · ${t.weight}%</div>
      <h3>${t.name}</h3>
      <div class="meta">${qCount} questions available · ${t.target} on exam</div>
      ${score ? `<div class="badge" style="background:rgba(255,255,255,.08);color:${scoreColor}">✓ ${score.correct}/${score.total} (${scorePct}%)</div>` : ''}
      ${wrong.length > 0 ? `<div class="badge" style="background:rgba(239,68,68,.15);color:var(--red);margin-left:.3rem">⚠ ${wrong.length} to retry</div>` : ''}
    `;
    card.style.setProperty('--t-color', t.color);
    card.addEventListener('click', () => startTopicQuiz(t.id));
    grid.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════════
//  START QUIZ
// ═══════════════════════════════════════════════════════
function startTopicQuiz(topicId) {
  state.mode = 'topic';
  state.currentTopicId = topicId;
  state.userAnswers = {};
  state.submitted = false;
  state.questionsForTopic[topicId] = getTopicQuestions(topicId);
  renderQuiz(topicId);
}

function startFullExam() {
  state.mode = 'full';
  state.topicQueue = TOPICS.map(t => t.id);
  state.activeTopicIndex = 0;
  state.userAnswers = {};
  state.scores = {};
  TOPICS.forEach(t => {
    state.questionsForTopic[t.id] = getTopicQuestions(t.id);
  });
  const firstTopic = state.topicQueue[0];
  state.currentTopicId = firstTopic;
  state.submitted = false;
  renderQuiz(firstTopic);
}

// ═══════════════════════════════════════════════════════
//  RENDER QUIZ
// ═══════════════════════════════════════════════════════
function renderQuiz(topicId) {
  const topic = TOPICS.find(t => t.id === topicId);
  const questions = state.questionsForTopic[topicId];
  state.submitted = false;

  document.getElementById('quizTopicLabel').textContent = `Topic ${topic.id} of ${TOPICS.length}`;
  document.getElementById('quizTopicName').textContent = topic.name;

  updateProgress(topicId);
  startTimer();

  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  questions.forEach((q, idx) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.id = `qblock_${q.id}`;

    block.innerHTML = `
      <div class="q-number">Question ${idx + 1} of ${questions.length}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts_${q.id}">
        ${['a','b','c','d'].map(letter => `
          <button class="option-btn" data-qid="${q.id}" data-letter="${letter}" onclick="selectOption('${q.id}','${letter}')">
            <span class="option-letter">${letter.toUpperCase()}</span>
            <span class="option-text">${q[letter]}</span>
          </button>
        `).join('')}
      </div>
      <div class="explanation" id="exp_${q.id}"></div>
    `;

    container.appendChild(block);
  });

  updateSubmitBtn(topicId);
  showScreen('quiz');
}

function selectOption(qid, letter) {
  if (state.submitted) return;
  state.userAnswers[qid] = letter;

  const opts = document.querySelectorAll(`[data-qid="${qid}"]`);
  opts.forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.letter === letter);
  });

  document.getElementById(`qblock_${qid}`).classList.add('answered');

  const topicId = state.currentTopicId;
  const questions = state.questionsForTopic[topicId];
  const answered = questions.filter(q => state.userAnswers[q.id]).length;

  updateProgress(topicId, answered);
  updateSubmitBtn(topicId);
}

function updateProgress(topicId, answeredOverride) {
  const questions = state.questionsForTopic[topicId];
  const answered = answeredOverride !== undefined ? answeredOverride : questions.filter(q => state.userAnswers[q.id]).length;
  const total = questions.length;
  const pct = Math.round(answered / total * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${answered}/${total} answered`;
}

function updateSubmitBtn(topicId) {
  const questions = state.questionsForTopic[topicId];
  const answered = questions.filter(q => state.userAnswers[q.id]).length;
  const btn = document.getElementById('submitQuizBtn');
  btn.disabled = answered < questions.length;
  btn.textContent = answered < questions.length
    ? `Submit (${questions.length - answered} remaining)`
    : 'Submit Answers ✓';
}

// ═══════════════════════════════════════════════════════
//  SUBMIT & REVIEW
// ═══════════════════════════════════════════════════════
function submitQuiz() {
  if (state.submitted) return;
  state.submitted = true;
  stopTimer();

  const topicId = state.currentTopicId;
  const questions = state.questionsForTopic[topicId];
  let correct = 0;

  questions.forEach(q => {
    const chosen = state.userAnswers[q.id];
    const isCorrect = chosen === q.correct;
    if (isCorrect) correct++;

    const opts = document.querySelectorAll(`[data-qid="${q.id}"]`);
    opts.forEach(btn => {
      btn.disabled = true;
      btn.classList.remove('selected');
      if (btn.dataset.letter === q.correct) {
        btn.classList.add('correct');
        if (chosen !== q.correct) {
          btn.innerHTML += `<span class="result-badge correct-badge">✓ Correct answer</span>`;
        }
      }
      if (btn.dataset.letter === chosen && chosen !== q.correct) {
        btn.classList.add('wrong');
        btn.innerHTML += `<span class="result-badge wrong-badge">✗ Your answer</span>`;
      }
    });

    // Show explanation
    const expEl = document.getElementById(`exp_${q.id}`);
    const letters = ['a','b','c','d'];
    const wrongOpts = letters.filter(l => l !== q.correct).map(l => `${l.toUpperCase()}) ${q[l]}`).join('<br>');
    expEl.innerHTML = `
      <strong>✅ Correct: ${q.correct.toUpperCase()}) ${q[q.correct]}</strong>
      ${chosen !== q.correct ? `<br><br>You selected: ${chosen.toUpperCase()}) ${q[chosen]}` : ''}
    `;
    expEl.classList.add('show');

    // Color block border
    const block = document.getElementById(`qblock_${q.id}`);
    block.style.borderColor = isCorrect ? 'var(--green)' : 'var(--red)';
  });

  state.scores[topicId] = { correct, total: questions.length };

  // Collect wrong question IDs for retry mode
  const wrongForThisTopic = questions.filter(q => state.userAnswers[q.id] !== q.correct).map(q => q.id);
  if (state.mode === 'retry') {
    // Only keep the ones still wrong after this retry round
    state.wrongIds[topicId] = wrongForThisTopic;
    state.retryAttempts[topicId] = (state.retryAttempts[topicId] || 1) + 1;
  } else {
    state.wrongIds[topicId] = wrongForThisTopic;
    state.retryAttempts[topicId] = 0;
  }

  // Update submit button to show score
  const btn = document.getElementById('submitQuizBtn');
  btn.textContent = `Score: ${correct}/${questions.length} (${Math.round(correct/questions.length*100)}%)`;
  btn.disabled = true;

  // Show next topic button if in full exam mode and not last topic
  const nextBtn = document.getElementById('nextTopicBtn');
  if (state.mode === 'full') {
    const currentIdx = state.topicQueue.indexOf(topicId);
    if (currentIdx < state.topicQueue.length - 1) {
      nextBtn.style.display = 'inline-flex';
      nextBtn.textContent = `Next: ${TOPICS[currentIdx + 1].name} →`;
    } else {
      nextBtn.style.display = 'none';
    }
  }

  // Show results
  showResults(topicId);
}

// ═══════════════════════════════════════════════════════
//  RESULTS
// ═══════════════════════════════════════════════════════
function showResults(topicId) {
  const topic = TOPICS.find(t => t.id === topicId);
  const score = state.scores[topicId];
  const pct = Math.round(score.correct / score.total * 100);

  // Score ring
  document.getElementById('scoreRing').style.setProperty('--pct', pct);
  document.getElementById('scoreRingPct').textContent = pct + '%';
  document.getElementById('scoreRingFrac').textContent = `${score.correct}/${score.total}`;

  // Title
  let emoji = pct >= 80 ? '🎉' : pct >= 60 ? '💪' : '📚';
  document.getElementById('resultsTitle').textContent = `${emoji} ${topic.name}`;
  const grade = pct >= 80 ? 'Great work! Keep it up.' : pct >= 60 ? 'Good progress. Review missed questions.' : 'Needs more study. Focus on this topic.';
  document.getElementById('resultsGrade').textContent = `You scored ${pct}% — ${grade}`;

  // Topic breakdown (show all completed topics)
  const container = document.getElementById('topicResultsContainer');
  container.innerHTML = '';

  const completedTopics = TOPICS.filter(t => state.scores[t.id]);
  completedTopics.forEach(t => {
    const s = state.scores[t.id];
    const p = Math.round(s.correct / s.total * 100);
    const stars = p >= 80 ? '⭐⭐⭐' : p >= 60 ? '⭐⭐' : '⭐';
    const barColor = p >= 80 ? 'var(--green)' : p >= 60 ? 'var(--yellow)' : 'var(--red)';
    const row = document.createElement('div');
    row.className = 'topic-result-row';
    row.innerHTML = `
      <div class="tr-label">
        <div class="name">Topic ${t.id}: ${t.name}</div>
        <div class="meta">${s.correct}/${s.total} correct</div>
      </div>
      <div class="tr-bar-wrap">
        <div class="tr-bar-bg"><div class="tr-bar-fill" style="width:${p}%;background:${barColor}"></div></div>
      </div>
      <div class="tr-score" style="color:${barColor}">${p}%</div>
      <div class="tr-stars">${stars}</div>
    `;
    container.appendChild(row);
  });

  // Recommendations (show when full exam done or always for context)
  const recBox = document.getElementById('recommendationsBox');
  const recList = document.getElementById('recommendationsList');

  if (completedTopics.length >= 1) {
    const sorted = [...completedTopics].sort((a,b) => {
      const pa = Math.round(state.scores[a.id].correct / state.scores[a.id].total * 100);
      const pb = Math.round(state.scores[b.id].correct / state.scores[b.id].total * 100);
      return pa - pb;
    });

    const recs = [
      { icon: '🎯', text: `Focus most on <strong>${sorted[0].name}</strong> — your weakest area. Review the official Trailhead module and Salesforce documentation for this topic.` },
      { icon: '🔁', text: `Re-attempt the quiz for <strong>${sorted[0].name}</strong> and <strong>${sorted[1] ? sorted[1].name : sorted[0].name}</strong> after reviewing. Repetition builds confidence.` },
      { icon: '📖', text: `For each question you missed, trace back the concept in the Salesforce Data 360 documentation or Trailhead Data Cloud specialist trail.` },
    ];

    recList.innerHTML = recs.map(r => `<div class="rec-item"><span class="rec-icon">${r.icon}</span><span>${r.text}</span></div>`).join('');
    recBox.style.display = 'block';
  } else {
    recBox.style.display = 'none';
  }

  // Retry wrong answers button
  const retryBtn = document.getElementById('retryWrongBtn');
  const retryBanner = document.getElementById('retryBanner');
  const wrongIds = state.wrongIds[topicId] || [];
  const attempts = state.retryAttempts[topicId] || 0;

  if (wrongIds.length > 0) {
    retryBtn.style.display = 'inline-flex';
    retryBtn.textContent = `🔁 Retry ${wrongIds.length} Wrong Answer${wrongIds.length > 1 ? 's' : ''}`;
    retryBtn.onclick = () => startRetryQuiz(topicId);

    retryBanner.style.display = 'flex';
    const attemptLabel = attempts > 0 ? ` (retry round ${attempts})` : '';
    document.getElementById('retryBannerText').innerHTML =
      `You got <strong style="color:var(--red)">${wrongIds.length} question${wrongIds.length > 1 ? 's' : ''} wrong${attemptLabel}</strong>. Hit <strong>Retry Wrong Answers</strong> to drill only those until you nail them all. 💪`;
  } else {
    retryBtn.style.display = 'none';
    retryBanner.style.display = 'none';
    if (pct === 100) {
      retryBanner.style.display = 'flex';
      retryBanner.innerHTML = `<span class="retry-banner-icon">🏆</span><span><strong style="color:var(--green)">Perfect score!</strong> You got every question right${attempts > 0 ? ` after ${attempts} retry round${attempts > 1 ? 's' : ''}` : ''}. Move to the next topic.</span>`;
    }
  }

  // Next topic button (for full exam flow)
  const nextBtn = document.getElementById('nextTopicBtn');
  if (state.mode === 'full') {
    const currentIdx = state.topicQueue.indexOf(topicId);
    if (currentIdx < state.topicQueue.length - 1) {
      nextBtn.style.display = 'inline-flex';
      nextBtn.textContent = `Next: Topic ${currentIdx + 2} →`;
      nextBtn.onclick = () => {
        state.activeTopicIndex = currentIdx + 1;
        state.currentTopicId = state.topicQueue[currentIdx + 1];
        state.submitted = false;
        renderQuiz(state.currentTopicId);
        showScreen('quiz');
      };
    } else {
      nextBtn.style.display = 'none';
    }
  } else {
    nextBtn.style.display = 'none';
  }

  showScreen('results');
}

// ═══════════════════════════════════════════════════════
//  RETRY WRONG ANSWERS
// ═══════════════════════════════════════════════════════
function startRetryQuiz(topicId) {
  const wrongIds = state.wrongIds[topicId] || [];
  if (wrongIds.length === 0) return;

  // Build question set from wrong IDs, shuffled
  const wrongQuestions = shuffle(ALL_QUESTIONS.filter(q => wrongIds.includes(q.id)));

  state.mode = 'retry';
  state.currentTopicId = topicId;
  state.userAnswers = {};
  state.submitted = false;
  state.questionsForTopic[topicId] = wrongQuestions;

  // Update header to show retry context
  renderRetryQuiz(topicId, wrongQuestions);
}

function renderRetryQuiz(topicId, questions) {
  const topic = TOPICS.find(t => t.id === topicId);
  const attempts = (state.retryAttempts[topicId] || 0) + 1;

  document.getElementById('quizTopicLabel').textContent = `Topic ${topic.id} — Retry Round ${attempts}`;
  document.getElementById('quizTopicName').textContent = `${topic.name} · ${questions.length} wrong answer${questions.length > 1 ? 's' : ''} to fix`;

  updateProgress(topicId);
  startTimer();

  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  // Retry mode banner at top
  const banner = document.createElement('div');
  banner.style.cssText = 'background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:1rem 1.5rem;margin-bottom:1.5rem;font-size:.9rem;';
  banner.innerHTML = `<strong style="color:var(--yellow)">🔁 Retry Mode — Round ${attempts}</strong><br><span style="color:var(--muted)">Answer all ${questions.length} question${questions.length > 1 ? 's' : ''} you previously got wrong. Reach 100% to clear this topic!</span>`;
  container.appendChild(banner);

  questions.forEach((q, idx) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.id = `qblock_${q.id}`;
    block.style.borderColor = 'rgba(239,68,68,.2)'; // subtle red tint — these were wrong

    block.innerHTML = `
      <div class="q-number" style="color:var(--yellow)">Retry Question ${idx + 1} of ${questions.length}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts_${q.id}">
        ${['a','b','c','d'].map(letter => `
          <button class="option-btn" data-qid="${q.id}" data-letter="${letter}" onclick="selectOption('${q.id}','${letter}')">
            <span class="option-letter">${letter.toUpperCase()}</span>
            <span class="option-text">${q[letter]}</span>
          </button>
        `).join('')}
      </div>
      <div class="explanation" id="exp_${q.id}"></div>
    `;
    container.appendChild(block);
  });

  updateSubmitBtn(topicId);
  showScreen('quiz');
}

// ═══════════════════════════════════════════════════════
//  EVENT LISTENERS
// ═══════════════════════════════════════════════════════
document.getElementById('startAllBtn').addEventListener('click', startFullExam);

document.getElementById('submitQuizBtn').addEventListener('click', submitQuiz);

document.getElementById('backToMenuBtn').addEventListener('click', () => {
  stopTimer();
  initWelcome();
  showScreen('welcome');
});

document.getElementById('restartBtn').addEventListener('click', () => {
  state.scores = {};
  state.wrongIds = {};
  state.retryAttempts = {};
  initWelcome();
  showScreen('welcome');
});

document.getElementById('reviewAnswersBtn').addEventListener('click', () => {
  showScreen('quiz');
});

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
initWelcome();
</script>
